stages:
  - build
  - precompile
  - deploy

variables:
  CI_PROJECT_ENV: ${CI_PROJECT_NAME}_${CI_COMMIT_BRANCH}
  CI_VERSION_ENV: "latest"
  RUNNER_SCRIPT_TIMEOUT: 50m

# ==============================================================================
# 1. BUILD BASE (Kaniko - Zero-Trust: Sem dind, sem root no host, sem socket)
# ==============================================================================
base:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - REG_USER="${CI_DEPLOY_USER:-$CI_REGISTRY_USER}"
    - REG_PASS="${CI_DEPLOY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "Iniciando compilação segura da imagem base com Kaniko..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile"
        --build-arg CI_PROJECT_ENV=$CI_PROJECT_ENV
        --build-arg CI_VERSION_ENV=$CI_VERSION_ENV
        --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
        --build-arg RAILS_ENV=$RAILS_ENV
        --build-arg SECRET_KEY_BASE=$SECRET_KEY_BASE
        --destination "${CI_REGISTRY_IMAGE}/${CI_PROJECT_ENV}:${CI_VERSION_ENV}"
        --destination "${CI_REGISTRY_IMAGE}/${CI_PROJECT_ENV}:${CI_COMMIT_SHORT_SHA}"
        --skip-tls-verify
        --cache=true
  tags:
    - kaniko
  only:
    - master
    - develop
  when: manual

# ==============================================================================
# 2. PRECOMPILAÇÃO DE ASSETS (Rails Rake isolado, sem dind)
# ==============================================================================
precompile:
  stage: precompile
  image: ${CI_REGISTRY_IMAGE}/${CI_PROJECT_ENV}:${CI_VERSION_ENV}
  environment:
    name: $CI_COMMIT_BRANCH
  tags:
    - docker
  only:
    - master
    - develop
  script:
    - mkdir -p log
    ## Assets precompile
    - bundle exec rake assets:precompile --trace
    - bundle exec rake assets:clean
    ## Cleanup
    - cp public/assets/.sprockets-manifest-*.json .
    - bundle exec rake assets:clobber
    - mkdir -p public/assets
    - cp .sprockets-manifest-*.json public/assets/
  artifacts:
    paths:
      - public/assets/
    expire_in: 1 day
  when: manual

# ==============================================================================
# 3. ATTACH ASSETS (Kaniko - Embala os assets gerados na imagem final)
# ==============================================================================
attach-assets:
  stage: precompile
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - REG_USER="${CI_DEPLOY_USER:-$CI_REGISTRY_USER}"
    - REG_PASS="${CI_DEPLOY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "Empacotando assets finais na imagem via Kaniko..."
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile-gitlab"
        --build-arg CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        --build-arg CI_PROJECT_ENV=$CI_PROJECT_ENV
        --build-arg CI_VERSION_ENV=$CI_VERSION_ENV
        --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA
        --destination "${CI_REGISTRY_IMAGE}/${CI_PROJECT_ENV}:${CI_VERSION_ENV}"
        --destination "${CI_REGISTRY_IMAGE}/${CI_PROJECT_ENV}:${CI_COMMIT_SHORT_SHA}"
        --skip-tls-verify
        --cache=true
  needs:
    - job: precompile
      artifacts: true
  tags:
    - docker
  only:
    - master
    - develop

# ==============================================================================
# 4. DEPLOY SEGURO (Disparo de Webhook Pull-based)
# ==============================================================================
deploy:
  stage: deploy
  image: curlimages/curl:latest
  environment:
    name: $CI_COMMIT_BRANCH
  tags:
    - docker
  only:
    - master
    - develop
  script:
    - echo "=== Disparando Webhook de Deploy em srv-weby-teste (200.137.218.139) ==="
    - |
      curl -f -sS -X POST \
        -H "X-Gitlab-Token: ${WEBHOOK_SECRET}" \
        -H "Content-Type: application/json" \
        -d "{\"project\":\"${CI_PROJECT_NAME}\",\"branch\":\"${CI_COMMIT_BRANCH}\",\"commit\":\"${CI_COMMIT_SHORT_SHA}\"}" \
        http://200.137.218.139:9000/hooks/deploy-weby
    - echo ""
    - echo "Deploy solicitado com sucesso! A VM de destino atualizou os contêineres."
  when: manual
