version: '3.4'
services:
  redis:
    image: redis:7-alpine
    container_name: ${CI_PROJECT_ENV:-weby}_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  weby:
    image: ${CI_REGISTRY_IMAGE:-registry.cercomp.ufg.br/sysadmin/weby}/${CI_PROJECT_ENV:-weby_develop}:${CI_VERSION_ENV:-latest}
    container_name: ${CI_PROJECT_ENV}
    restart: always
    depends_on:
      - redis
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CI_COMMIT_SHORT_SHA: ${CI_COMMIT_SHORT_SHA}
        RAILS_ENV: ${RAILS_ENV}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        STORAGE_BUCKET: ${STORAGE_BUCKET}
        STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
        STORAGE_ACCESS_SECRET: ${STORAGE_ACCESS_SECRET}
        STORAGE_HOST: ${STORAGE_HOST}
        STORAGE_BUCKET_ALBUM: ${STORAGE_BUCKET_ALBUM}
        STORAGE_ACCESS_KEY_ALBUM: ${STORAGE_ACCESS_KEY_ALBUM}
        STORAGE_ACCESS_SECRET_ALBUM: ${STORAGE_ACCESS_SECRET_ALBUM}
        STORAGE_HOST_ALBUM: ${STORAGE_HOST_ALBUM}
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RAILS_LOG_TO_STDOUT=true
    volumes:
      - /home/gitlab-runner/tmp/cache:/opt/weby/tmp/cache

volumes:
  redis_data:

