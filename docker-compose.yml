version: '3.7'

services:
  db:
    image: postgres:13-alpine
    container_name: weby_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weby_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: weby_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  weby:
    image: weby_weby:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: weby_app
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    volumes:
      - .:/opt/weby
      - bundle_cache:/usr/local/bundle
    env_file:
      - .env
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=password
      - DB_DB=weby_development
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    command: bash -c "rm -f tmp/pids/server.pid && (bundle check || bundle install) && bundle exec rails server -b 0.0.0.0 -p 3000"

volumes:
  postgres_data:
  bundle_cache:
  redis_data:
